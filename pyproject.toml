[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "automatic-gh-review"
version = "0.1.0"
description = "Automated GitHub PR review bot using LLMs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "litellm>=1.50.0",
    "httpx>=0.27.0",
    "unidiff>=0.7.5",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "tenacity>=9.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
